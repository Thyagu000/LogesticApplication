<!DOCTYPE html>
<html>
<head>
<title>Partner Delivery Dashboard</title>

<style>

body{
font-family: Arial;
margin:0;
display:flex;
background:#f4f6f9;
}

/* Sidebar */

.sidebar{
width:220px;
background:#2c3e50;
color:white;
height:100vh;
padding-top:20px;
}

.sidebar h2{
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
padding:12px 20px;
text-decoration:none;
}

.sidebar a:hover{
background:#34495e;
}

/* Main */

.main{
flex:1;
padding:20px;
}

.header{
background:white;
padding:15px;
box-shadow:0 0 5px gray;
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="sidebar">

<h2>Dashboard</h2>

<a href="/">Home</a>
<a href="/orders/">Orders</a>
<a href="/partners/">Partners</a>
<a href="/payments/">Payments</a>
<a href="/deliveries/">Deliveries</a>

</div>

<div class="main">

<div class="header">
<h2>Partner / Delivery Dashboard</h2>
</div>

{% block content %}
{% endblock %}

</div>

</body>
</html>
