<!DOCTYPE html>
<html>
<head>
<title>Payments</title>
</head>

<body>

<h2>Partner Payments</h2>

<table border="1" cellpadding="10">

<tr>
<th>Partner Name</th>
<th>Amount</th>
<th>Status</th>
</tr>

{% for payment in payments %}
<tr>
<td>{{ payment.partner }}</td>
<td>{{ payment.amount }}</td>
<td>{{ payment.status }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
