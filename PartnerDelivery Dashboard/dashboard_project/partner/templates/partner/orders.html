<!DOCTYPE html>
<html>
<head>
<title>Orders</title>

<style>

body{
font-family: Arial;
margin:0;
display:flex;
background:#f4f6f9;
}

.sidebar{
width:220px;
background:#2c3e50;
color:white;
height:100vh;
padding-top:20px;
}

.sidebar h2{
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
padding:12px 20px;
text-decoration:none;
}

.sidebar a:hover{
background:#34495e;
}

.main{
flex:1;
padding:20px;
}

.header{
background:white;
padding:15px;
box-shadow:0 0 5px gray;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th,td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

th{
background:#34495e;
color:white;
}

</style>
</head>

<body>

<div class="sidebar">

<h2>Dashboard</h2>

<a href="/">Home</a>
<a href="/orders/">Orders</a>
<a href="/partners/">Partners</a>
<a href="/deliveries/">Deliveries</a>
<a href="/payments/">Payments</a>

</div>

<div class="main">

<div class="header">
<h2>Orders</h2>
</div>

<table>

<tr>
<th>Order ID</th>
<th>Customer</th>
<th>Address</th>
<th>Status</th>
</tr>

{% for order in orders %}
<tr>
<td>{{ order.id }}</td>
<td>{{ order.customer }}</td>
<td>{{ order.address }}</td>
<td>{{ order.status }}</td>
</tr>
{% endfor %}

</table>

</div>

</body>
</html>
